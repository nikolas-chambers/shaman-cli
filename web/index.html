* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; }
button, select, textarea, input { font:inherit; color:inherit; }
button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
button.ghost { background:none; border-color:transparent; color:var(--muted); padding:4px 8px; }
button.ghost:hover { color:var(--fg); border-color:var(--line); }
select, input.text { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
select { max-width:240px; }
#side { width:280px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
.brand { display:flex; align-items:center; gap:10px; padding:14px 14px 10px; }
.brand img { width:30px; height:30px; border-radius:8px; filter:var(--icon-filter); }
.brand b { font-size:17px; letter-spacing:.03em; flex:1; }
#search { margin:0 12px 8px; }
#sessions { overflow-y:auto; flex:1; padding:0 8px 8px; }
.side-foot { padding:10px 12px; border-top:1px solid var(--line); }
.side-foot select { width:100%; max-width:none; }
#row select { max-width:170px; }
.sess { display:flex; align-items:center; gap:4px; padding:7px 8px 7px 10px; border-radius:8px; cursor:pointer; color:var(--muted); }
.sess span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sess .acts { display:none; }
.dot { width:8px; height:8px; border-radius:50%; flex:none; margin-right:4px; }
.dot.run { background:var(--accent); animation:pulse 1s infinite; }
.dot.new { background:var(--add); }
.sess:hover { background:var(--bg); color:var(--fg); } .sess:hover .acts { display:flex; }
.sess.active { background:var(--bg); color:var(--fg); font-weight:600; }
.sess .acts button { padding:0 6px; font-size:13px; border:none; background:none; color:var(--muted); }
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#bar { display:flex; gap:6px; align-items:center; padding:9px 16px; border-bottom:1px solid var(--line); }
#bar select { max-width:210px; flex:none; }
#bar button { flex:none; }
#bar .spacer { flex:1; }
#title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 0; }
#log { flex:1; overflow-y:auto; padding:20px max(16px,calc((100% - 880px)/2)); }
.msg { margin:0 0 16px; }
.msg.user { background:var(--user); border-radius:12px; padding:10px 14px; white-space:pre-wrap; position:relative; }
.msg.user .tools { position:absolute; right:8px; top:6px; display:none; gap:4px; }
.msg.user:hover .tools { display:flex; }
.msg.user .tools button { font-size:12px; padding:2px 8px; }
.msg.assistant p { margin:0 0 10px; }
.msg.assistant table { border-collapse:collapse; margin:8px 0; } .msg.assistant td, .msg.assistant th { border:1px solid var(--line); padding:4px 10px; }
.msg.notice { color:var(--muted); font-size:13px; }
.msg.error { color:var(--err); }
.codeblock { position:relative; margin:8px 0; }
.codeblock .lang { position:absolute; left:10px; top:4px; font-size:11px; color:var(--muted); }
.codeblock button { position:absolute; right:6px; top:4px; font-size:11px; padding:1px 7px; opacity:.7; }
.msg pre { background:var(--code); border-radius:8px; padding:22px 12px 10px; overflow-x:auto; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; margin:0; }
.msg code { background:var(--code); border-radius:4px; padding:1px 4px; font:13px ui-monospace,Menlo,Consolas,monospace; }
.msg pre code { background:none; padding:0; }
.tok-k { color:var(--accent); } .tok-s { color:var(--add); } .tok-c { color:var(--muted); font-style:italic; } .tok-n { color:#c77dff; }
.reasoning { color:var(--muted); font-style:italic; font-size:14px; white-space:pre-wrap; }
details.tool { border:1px solid var(--line); border-radius:8px; margin:0 0 8px; font-size:13px; }
details.tool summary { padding:6px 10px; cursor:pointer; color:var(--muted); list-style:none; }
details.tool summary::before { content:"› "; color:var(--accent); }
details.tool.failed summary::before { content:"✗ "; color:var(--err); }
details.tool pre { margin:0; border-top:1px solid var(--line); padding:8px 10px; max-height:360px; overflow:auto; white-space:pre-wrap; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; }
.diff { border-top:1px solid var(--line); font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; max-height:420px; overflow:auto; }
.diff div { padding:0 10px; white-space:pre; } .diff .a { background:var(--add-bg); color:var(--add); } .diff .d { background:var(--del-bg); color:var(--del); }
.diff .h { color:var(--accent); background:var(--panel); }
#todos { display:none; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:13px; }
#todos.on { display:block; } #todos div { color:var(--muted); } #todos .doing { color:var(--fg); font-weight:600; } #todos .done { text-decoration:line-through; }
#composer { border-top:1px solid var(--line); padding:12px max(16px,calc((100% - 880px)/2)) 14px; position:relative; }
#attachments { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.chip { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; }
.chip button { border:none; background:none; padding:0 0 0 6px; color:var(--muted); }
#input { width:100%; min-height:56px; max-height:40vh; resize:vertical; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; outline:none; }
#input:focus { border-color:var(--accent); }
#composer.drag #input { border-style:dashed; border-color:var(--accent); }
#row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
#row .hint { color:var(--muted); font-size:12px; flex:1; min-width:0; }
#usage { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:8px; }
#ctx { width:80px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; } #ctx i { display:block; height:100%; width:0; background:var(--accent); }
#goal { width:150px; }
#menu-cmd { position:absolute; bottom:calc(100% - 4px); left:max(16px,calc((100% - 880px)/2)); background:var(--bg); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.18); display:none; min-width:320px; max-height:280px; overflow:auto; z-index:3; }
#menu-cmd div { padding:6px 12px; cursor:pointer; display:flex; gap:10px; } #menu-cmd div span { color:var(--muted); font-size:13px; }
#menu-cmd div.sel { background:var(--panel); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:5; }
.modal.open { display:flex; }
.card { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:18px; max-width:560px; width:100%; }
.card h3 { margin:0 0 8px; font-size:16px; }
.card pre { background:var(--code); padding:8px 10px; border-radius:8px; white-space:pre-wrap; word-break:break-all; font-size:13px; }
.card .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
.spin { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite; }
@keyframes pulse { 50% { opacity:.25; } }
#menu { display:none; }
@media (max-width:780px) {
  #side { position:fixed; z-index:4; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .2s; }
  #side.open { transform:none; }
  #menu { display:inline-block; }
  #bar { flex-wrap:wrap; } #title { max-width:60vw; } #goal { width:120px; }
}
</style>

      <select id="effort" title="Reasoning effort for models that think"><option value="">Effort: default</option><option value="low">Effort: low</option><option value="medium">Effort: medium</option><option value="high">Effort: high</option><option value="off">Thinking off</option></select>
      <span class="hint" id="status"></span>
      <span id="usage"><span id="ctx" title="Context used"><i></i></span><span id="cost"></span></span>
      <button id="stop" hidden>Stop</button>
      <button class="primary" id="send">Send</button>
    </div>
  </div>
</main>
<div class="modal" id="perm"><div class="card">
  <h3 id="perm-title">Permission</h3><pre id="perm-subject"></pre>
  <div class="actions"><button data-reply="reject">Deny</button><button data-reply="always">Always</button><button class="primary" data-reply="once">Allow once</button></div>
</div></div>
<div class="modal" id="ask"><div class="card">
  <h3 id="ask-title">Question</h3>
  <div id="ask-options" style="display:flex;flex-direction:column;gap:6px;margin:10px 0"></div>
  <input id="ask-text" class="text" placeholder="Or type your own answer" style="width:100%">
  <div class="actions"><button id="ask-skip">Skip</button><button class="primary" id="ask-send">Answer</button></div>
</div></div>
<div class="modal" id="auth"><div class="card">
  <h3>Server token</h3><p>This server requires a token (<code>shaman serve --token</code>).</p>
  <input id="token" type="password" class="text" style="width:100%">
  <div class="actions"><button class="primary" id="token-save">Save</button></div>
</div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let token = store.get("shaman.token") || "";
// Embedded (VS Code extension, desktop app): the host hands over the token in the URL, then removes it from view.
const embedded = new URLSearchParams(location.search).has("embed");
{
  const params = new URLSearchParams(location.search);
  if (params.get("token")) { token = params.get("token"); store.set("shaman.token", token); history.replaceState(null, "", location.pathname); }
}
// The host may insert text (a code selection, an @file) into the input: only when it opened the page with ?embed,
// and only from the parent window. Nothing is sent without you pressing Enter.
window.addEventListener("message", (e) => {
  if (!embedded || e.source !== window.parent || window.parent === window || !e.data || e.data.type !== "shaman.insert") return;
  const input = document.getElementById("input");
  input.value += (input.value && !input.value.endsWith("\n") ? "\n" : "") + e.data.text;
  input.focus();
  input.dispatchEvent(new Event("input"));
});
let current = null, busy = false, pendingPermission = null, pendingQuestion = null, opening = Promise.resolve();
// Parallel sessions: one entry per session with a turn in progress (its events, replayed when you switch back),
// and the sessions that finished while you were looking elsewhere.
const runs = new Map(), unseen = new Set();
let models = [], commands = [], attachments = [], allSessions = [];
const builtins = [["new","new session"],["undo","restore files from before the last turn"],["revert","go back to an earlier message"],
  ["fork","copy this session into a new one"],["compact","summarise to free context"],["goal","keep working until done: /goal <text>"],
  ["mode","permission mode: /mode default|acceptEdits|plan|yolo"],["export","download Markdown"],["share","download HTML page"],["model","switch model: /model <id>"],["agent","switch agent: /agent <name>"]];

async function api(method, path, body, raw) {
  const headers = raw ? {} : { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, { method, headers, body: raw ? body : body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { $("auth").classList.add("open"); throw new Error("unauthorized"); }
  return res;
}
const getJSON = async (p) => (await api("GET", p)).json();

// ---------- markdown with code highlighting ----------
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\s][^*]*)\*/g, "$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
const KW = /\b(function|return|const|let|var|if|else|for|while|class|def|import|from|export|async|await|try|catch|new|struct|fn|pub|use|int|void|auto|include|public|private|static|true|false|null|None|self|this)\b/g;
function highlight(code) {
  // strings and comments first (as placeholders) so keywords inside them are left alone
  const saved = [];
  const keep = (cls) => (m) => { saved.push(`<span class="${cls}">${m}</span>`); return `\u0000${saved.length - 1}\u0000`; };
  let s = esc(code).replace(/(\/\/[^\n]*|#[^\n{]*$|\/\*[\s\S]*?\*\/)/gm, keep("tok-c")).replace(/(&quot;.*?&quot;|'[^'\n]*')/g, keep("tok-s"));
  s = s.replace(KW, '<span class="tok-k">$1</span>').replace(/\b(\d+(\.\d+)?)\b/g, '<span class="tok-n">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => saved[+i]);
}
function codeBlock(lang, code) {
  return `<div class="codeblock"><span class="lang">${esc(lang)}</span><button onclick="copyCode(this)">copy</button><pre><code>${highlight(code)}</code></pre></div>`;
}
window.copyCode = (b) => { navigator.clipboard?.writeText(b.parentElement.querySelector("code").innerText); b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200); };
function markdown(src) {
  const out = []; let para = [], list = null, code = null, lang = "", table = [];
  const flush = () => {
    if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = [];
    if (list) { out.push("<ul>" + list.map((l) => "<li>" + inline(l) + "</li>").join("") + "</ul>"); list = null; }
    if (table.length) {
      const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      out.push("<table>" + rows.map((r, i) => "<tr>" + r.map((c) => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>");
      table = [];
    }
  };
  for (const line of src.split("\n")) {
    const fence = line.trim().match(/^```(\S*)/);
    if (fence) { if (code === null) { flush(); code = []; lang = fence[1]; } else { out.push(codeBlock(lang, code.join("\n"))); code = null; } continue; }
    if (code !== null) { code.push(line); continue; }
    if (line.trim().startsWith("|")) { if (para.length || list) flush(); table.push(line); continue; }
    if (table.length) flush();
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) { flush(); const n = Math.min(h[1].length + 2, 6); out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
    const li = line.match(/^\s*[-*+]\s+(.*)/) || line.match(/^\s*\d+\.\s+(.*)/);
    if (li) { if (para.length) { const l = list; list = null; flush(); list = l; } (list = list || []).push(li[1]); continue; }
    if (!line.trim()) { flush(); continue; }
    if (list) flush();
    para.push(line);
  }
  if (code !== null) out.push(codeBlock(lang, code.join("\n")));
  flush();
  return out.join("");
}

// ---------- transcript ----------
function scroll() { const l = $("log"); if (l.scrollHeight - l.scrollTop - l.clientHeight < 200) l.scrollTop = l.scrollHeight; }
function add(cls, html) { const el = document.createElement("div"); el.className = "msg " + cls; el.innerHTML = html; $("log").appendChild(el); scroll(); return el; }
function userMsg(text, turn) {
  const el = add("user", esc(text));
  if (turn !== undefined) {
    const t = document.createElement("div"); t.className = "tools";
    t.innerHTML = `<button title="Go back to before this message (files restored)">Revert</button><button title="Copy the conversation up to here into a new session">Fork</button>`;
    t.children[0].onclick = () => revert(turn); t.children[1].onclick = () => fork(turn);
    el.appendChild(t);
  }
}
function diffHtml(d) {
  return '<div class="diff">' + d.split("\n").filter((l) => l && !l.startsWith("---") && !l.startsWith("+++"))
    .map((l) => `<div class="${l[0] === "+" ? "a" : l[0] === "-" ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l)}</div>`).join("") + "</div>";
}
function toolCard(title, output, failed, diff) {
  const d = document.createElement("details"); d.className = "tool" + (failed ? " failed" : "");
  if (diff) d.open = true;
  d.innerHTML = `<summary>${esc(title)}</summary>` + (diff ? diffHtml(diff) : `<pre>${esc(output || "")}</pre>`);
  $("log").appendChild(d); scroll();
}
function renderTodos(input) {
  const todos = input?.todos || [];
  $("todos").classList.toggle("on", todos.length > 0);
  $("todos").innerHTML = "<b>Plan</b>" + todos.map((t) => `<div class="${t.status === "in_progress" ? "doing" : t.status === "completed" ? "done" : ""}">${
    t.status === "completed" ? "☑" : t.status === "in_progress" ? "▸" : "☐"} ${esc(t.content)}</div>`).join("");
}
async function renderHistory(messages) {
  $("log").innerHTML = ""; renderTodos(null);
  const run = current && runs.get(current.id);
  if (run) {  // a turn is in progress: show history before it, then replay its live events
    let last = -1;
    messages.forEach((m, i) => { if (m.role === "user" && m.parts.some((p) => p.type === "text")) last = i; });
    if (last >= 0) messages = messages.slice(0, last);
  }
  const turns = current ? await getJSON(`/session/${current.id}/turns`).catch(() => []) : [];
  let turnIdx = 0;
  const starts = new Set(); let count = 0;
  messages.forEach((m, i) => { if (m.role === "user" && m.parts.some((p) => p.type === "text")) starts.add(i); });
  messages.forEach((m, i) => {
    for (const p of m.parts) {
      if (p.type === "text") {
        if (m.role === "user") {
          const t = turns[turnIdx]; const isTurn = t && t.text === p.text;
          userMsg(p.text, isTurn ? t.turn : undefined); if (isTurn) turnIdx++;
        } else add("assistant", markdown(p.text));
      } else if (p.type === "tool_call" && p.name === "todowrite") renderTodos(p.input);
      else if (p.type === "tool_result") toolCard(p.title || p.name, p.output, p.is_error, p.diff);
    }
  });
  if (run) replayRun(run);
  $("log").scrollTop = $("log").scrollHeight;
}

// ---------- sessions ----------
async function loadSessions() {
  allSessions = await getJSON("/session");
  const q = $("search").value.toLowerCase();
  const box = $("sessions"); box.innerHTML = "";
  for (const s of allSessions.filter((s) => !q || (s.title || s.id).toLowerCase().includes(q))) {
    const el = document.createElement("div");
    el.className = "sess" + (current && s.id === current.id ? " active" : "");
    const badge = runs.has(s.id) ? '<i class="dot run" title="working"></i>' : unseen.has(s.id) ? '<i class="dot new" title="finished"></i>' : "";
    el.innerHTML = `${badge}<span title="${esc(s.title || s.id)}">${esc(s.title || "New session")}</span><div class="acts"><button title="Rename">✎</button><button title="Delete">🗑</button></div>`;
    el.onclick = () => { openSession(s); $("side").classList.remove("open"); };
    el.querySelectorAll(".acts button")[0].onclick = async (e) => { e.stopPropagation(); const t = prompt("Rename session", s.title || ""); if (t !== null) { await api("POST", `/session/${s.id}/title`, { title: t }); loadSessions(); if (current?.id === s.id) $("title").textContent = t; } };
    el.querySelectorAll(".acts button")[1].onclick = async (e) => { e.stopPropagation(); if (confirm("Delete this session?")) { await api("DELETE", `/session/${s.id}`); if (current?.id === s.id) { current = null; $("log").innerHTML = ""; } loadSessions(); } };
    box.appendChild(el);
  }
}
function openSession(s) { return (opening = doOpen(s)); }
async function doOpen(s) {
  current = s; store.set("shaman.session", s.id);
  $("title").textContent = s.title || "New session"; $("agent").value = s.agent; $("goal").value = s.goal || "";
  usage(s);
  unseen.delete(s.id);
  syncBusy();
  await renderHistory(await getJSON(`/session/${s.id}/message`));
  loadSessions();
}
async function newSession() { await openSession(await (await api("POST", "/session", { agent: $("agent").value || "build" })).json()); }
async function refresh() { const s = await getJSON(`/session/${current.id}`); current = s; $("title").textContent = s.title || "New session"; usage(s); loadSessions(); }
function usage(s) {
  const inTok = s?.usage?.input ?? s?.input_tokens ?? 0, outTok = s?.usage?.output ?? s?.output_tokens ?? 0;
  $("cost").textContent = s ? `${inTok} in · ${outTok} out · $${(s.cost || 0).toFixed(4)}` : "";
  const m = models.find((x) => x.id === ($("model").value || s?.model)) || models[0];
  const ctx = m?.context || 128000;
  $("ctx").firstChild.style.width = Math.min(100, (s?.last_input || 0) / ctx * 100) + "%";
}
async function revert(turn) {
  if (busy || !confirm("Go back to before this message? Files changed since then are restored.")) return;
  const r = await (await api("POST", `/session/${current.id}/revert`, { turn })).json();
  if (r.error) return add("error", esc(r.error));
  await openSession(current); $("input").value = r.text || ""; $("input").focus();
  add("notice", "Reverted. Edit the message and send it again.");
}
async function fork(turn) {
  const r = await (await api("POST", `/session/${current.id}/fork`, turn === undefined ? {} : { turn })).json();
  if (r.error) return add("error", esc(r.error));
  await openSession(r);
}

// ---------- attachments ----------
async function upload(file) {
  const res = await api("POST", `/upload?name=${encodeURIComponent(file.name || "pasted.png")}`, file, true);
  const r = await res.json();
  if (r.path) { attachments.push(r); renderAttachments(); }
}
function renderAttachments() {
  $("attachments").innerHTML = attachments.map((a, i) => `<span class="chip">${esc(a.name)}<button data-i="${i}">✕</button></span>`).join("");
  $("attachments").querySelectorAll("button").forEach((b) => b.onclick = () => { attachments.splice(+b.dataset.i, 1); renderAttachments(); });
}
$("attach").onclick = () => $("file").click();
$("file").onchange = () => { for (const f of $("file").files) upload(f); $("file").value = ""; };
$("input").addEventListener("paste", (e) => { for (const it of e.clipboardData?.items || []) if (it.kind === "file") { e.preventDefault(); upload(it.getAsFile()); } });
["dragover", "dragenter"].forEach((ev) => $("composer").addEventListener(ev, (e) => { e.preventDefault(); $("composer").classList.add("drag"); }));
["dragleave", "drop"].forEach((ev) => $("composer").addEventListener(ev, (e) => { e.preventDefault(); $("composer").classList.remove("drag"); }));
$("composer").addEventListener("drop", (e) => { for (const f of e.dataTransfer.files) upload(f); });

// ---------- slash commands ----------
let menuItems = [], menuSel = 0;
function updateMenu() {
  const v = $("input").value;
  if (!v.startsWith("/") || v.includes(" ") && !v.startsWith("/model ") && !v.startsWith("/agent ") && !v.startsWith("/mode ")) { $("menu-cmd").style.display = "none"; menuItems = []; return; }
  const q = v.slice(1).toLowerCase();
  if (v.startsWith("/model ")) menuItems = models.filter((m) => m.id.includes(v.slice(7))).slice(0, 30).map((m) => ["model " + m.id, m.free ? "free" : m.name]);
  else if (v.startsWith("/agent ")) menuItems = [...$("agent").options].map((o) => ["agent " + o.value, ""]).filter((a) => a[0].includes(v.slice(1)));
  else if (v.startsWith("/mode ")) menuItems = ["default", "acceptEdits", "plan", "yolo"].map((m) => ["mode " + m, ""]);
  else menuItems = [...builtins, ...commands.map((c) => [c.name, c.description])].filter(([n]) => n.startsWith(q));
  menuSel = 0;
  $("menu-cmd").innerHTML = menuItems.map(([n, d], i) => `<div class="${i === menuSel ? "sel" : ""}" data-i="${i}">/${esc(n)} <span>${esc(d || "")}</span></div>`).join("");
  $("menu-cmd").style.display = menuItems.length ? "block" : "none";
  $("menu-cmd").querySelectorAll("div").forEach((d) => d.onclick = () => pick(+d.dataset.i));
}
function pick(i) { $("input").value = "/" + menuItems[i][0] + " "; $("menu-cmd").style.display = "none"; menuItems = []; $("input").focus(); }
async function runSlash(text) {
  const [name, ...rest] = text.slice(1).split(" "); const arg = rest.join(" ").trim();
  if (name === "new") return newSession();
  if (name === "undo") return $("undo").onclick();
  if (name === "compact") return $("compact").onclick();
  if (name === "export") return $("export").onclick();
  if (name === "share") return $("share").onclick();
  if (name === "fork") return fork(arg ? +arg - 1 : undefined);
  if (name === "revert") { const turns = await getJSON(`/session/${current.id}/turns`); if (turns.length) return revert(arg ? +arg - 1 : turns[turns.length - 1].turn); return; }
  if (name === "model") { $("model").value = arg; return add("notice", "model: " + arg); }
  if (name === "agent") { $("agent").value = arg; return add("notice", "agent: " + arg); }
  if (name === "mode") {
    if (arg === "plan") $("agent").value = "plan";
    else if ([...$("mode").options].some((o) => o.value === arg)) { $("mode").value = arg; if ($("agent").value === "plan") $("agent").value = "build"; }
    else return add("error", "modes: default, acceptEdits, plan, yolo");
    return add("notice", "mode: " + arg);
  }
  if (name === "goal") { $("goal").value = arg; return send("Work towards the goal: " + arg); }
  if (commands.some((c) => c.name === name)) return send(text, { command: name, arguments: arg });
  add("error", "unknown command /" + esc(name));
}

// ---------- sending ----------
function setBusy(b) { busy = b; $("send").hidden = b; $("stop").hidden = !b; $("status").innerHTML = b ? '<span class="spin"></span> working…' : ""; }
function syncBusy() { setBusy(!!(current && runs.has(current.id))); }
// Render one stream event of a run into the transcript (only when that session is on screen).
function applyEvent(run, event, d) {
  const ui = run.ui;
  if (event === "text") { ui.buffer += d.text; (ui.assistant ||= add("assistant", "")).innerHTML = markdown(ui.buffer); ui.reasoning = null; scroll(); }
  else if (event === "reasoning") { ui.thought += d.text; (ui.reasoning ||= add("reasoning", "")).textContent = ui.thought; }
  else if (event === "tool_start") { ui.assistant = null; ui.buffer = ""; if (d.name === "todowrite") renderTodos(d.input); }
  else if (event === "tool_end") toolCard(d.title || d.name, d.output, d.is_error, d.diff);
  else if (event === "step") { current.last_input = d.input_tokens; usage(current); }
  else if (event === "notice") add("notice", esc(d.text));
  else if (event === "done") { if (d.agent) $("agent").value = d.agent; if (d.mode) $("mode").value = d.mode; }
  else if (event === "error") add("error", esc(d.message));
}
function replayRun(run) {
  run.ui = { assistant: null, reasoning: null, buffer: "", thought: "" };
  userMsg(run.text);
  for (const [event, d] of run.events) applyEvent(run, event, d);
}
async function send(textArg, extra) {
  const text = (textArg ?? $("input").value).trim();
  if (!text) return;
  if (!textArg && text.startsWith("/")) { $("input").value = ""; updateMenu(); return runSlash(text); }
  await opening;
  if (!current) await newSession();
  if (runs.has(current.id)) return;  // this session is busy; others can run meanwhile
  if (!textArg) $("input").value = "";
  if (!current.title) { current.title = text.split("\n").find((l) => l.trim())?.trim().replace(/\s+/g, " ").slice(0, 60) || ""; $("title").textContent = current.title; }
  const shown = text + (attachments.length ? "\n📎 " + attachments.map((a) => a.name).join(", ") : "");
  const sid = current.id, session = current;
  const run = { text: shown, events: [], ui: { assistant: null, reasoning: null, buffer: "", thought: "" }, title: session.title };
  runs.set(sid, run);
  userMsg(shown);
  syncBusy();
  setTimeout(loadSessions, 300);  // the server has named the session by now
  const body = { text, agent: $("agent").value, mode: $("mode").value, effort: $("effort").value, ...(extra || {}) };
  if ($("model").value) body.model = $("model").value;
  if ($("goal").value.trim()) body.goal = $("goal").value.trim();
  if (attachments.length) body.files = attachments.map((a) => a.path);
  attachments = []; renderAttachments();
  const onScreen = () => current && current.id === sid;
  try {
    const res = await api("POST", `/session/${sid}/message`, body);
    if (!res.ok) { const msg = (await res.json()).error || res.statusText; run.events.push(["error", { message: msg }]); if (onScreen()) add("error", esc(msg)); return; }
    const reader = res.body.getReader(), dec = new TextDecoder(); let pending = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      pending += dec.decode(value, { stream: true }); let i;
      while ((i = pending.indexOf("\n\n")) >= 0) {
        const raw = pending.slice(0, i); pending = pending.slice(i + 2);
        let event = "message", data = "";
        for (const l of raw.split("\n")) { if (l.startsWith("event:")) event = l.slice(6).trim(); else if (l.startsWith("data:")) data += (data ? "\n" : "") + l.slice(5).replace(/^ /, ""); }
        if (!data) continue;
        const d = JSON.parse(data);
        if (event === "permission") { askPermission(d, run.title); continue; }  // prompts show wherever you are
        if (event === "question") { askQuestion(d, run.title); continue; }
        run.events.push([event, d]);
        if (onScreen()) applyEvent(run, event, d);
      }
    }
  } catch (e) { run.events.push(["error", { message: String(e.message || e) }]); if (onScreen()) add("error", esc(String(e.message || e))); }
  finally {
    runs.delete(sid);
    if (onScreen()) { syncBusy(); const keep = current.last_input; await refresh(); current.last_input = keep; usage(current); }
    else { unseen.add(sid); loadSessions(); }
  }
}
const promptQueue = [];  // permission prompts from several sessions wait their turn
function askPermission(d, from) {
  if ($("perm").classList.contains("open")) return promptQueue.push([d, from]);
  pendingPermission = d.id; $("perm-title").textContent = "Allow " + d.permission + "?" + (from && (!current || current.title !== from) ? ` (${from})` : ""); $("perm-subject").textContent = d.title || d.subject; $("perm").classList.add("open"); }
document.querySelectorAll("#perm [data-reply]").forEach((b) => b.onclick = async () => {
  $("perm").classList.remove("open");
  await api("POST", `/permission/${pendingPermission}`, { reply: b.dataset.reply });
  if (promptQueue.length) askPermission(...promptQueue.shift());
});
function askQuestion(d, from) {
  pendingQuestion = d.id; $("ask-title").textContent = d.question + (from && (!current || current.title !== from) ? ` (${from})` : ""); $("ask-text").value = ""; $("ask-options").innerHTML = "";
  for (const o of d.options || []) { const b = document.createElement("button"); b.textContent = o; b.onclick = () => answer(o); $("ask-options").appendChild(b); }
  $("ask").classList.add("open"); $("ask-text").focus();
}
async function answer(a) { $("ask").classList.remove("open"); await api("POST", `/question/${pendingQuestion}`, { answer: a }); }
$("ask-send").onclick = () => answer($("ask-text").value.trim());
$("ask-skip").onclick = () => answer("");
$("ask-text").addEventListener("keydown", (e) => { if (e.key === "Enter") answer($("ask-text").value.trim()); });

// ---------- wiring ----------
$("send").onclick = () => send();
$("stop").onclick = () => current && api("POST", `/session/${current.id}/abort`);
$("new").onclick = newSession;
$("menu").onclick = () => $("side").classList.toggle("open");
$("search").oninput = loadSessions;
$("input").addEventListener("input", updateMenu);
$("input").addEventListener("keydown", (e) => {
  if (menuItems.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault(); menuSel = (menuSel + (e.key === "ArrowDown" ? 1 : menuItems.length - 1)) % menuItems.length;
    $("menu-cmd").querySelectorAll("div").forEach((d, i) => d.classList.toggle("sel", i === menuSel)); return;
  }
  if (menuItems.length && (e.key === "Tab" || (e.key === "Enter" && !$("input").value.includes(" ")))) { e.preventDefault(); return pick(menuSel); }
  if (e.key === "Escape") { $("menu-cmd").style.display = "none"; menuItems = []; }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("undo").onclick = async () => { if (!current) return; const r = await (await api("POST", `/session/${current.id}/undo`)).json(); add("notice", esc(r.changes || r.error || "done")); };
$("compact").onclick = async () => { if (!current) return; await api("POST", `/session/${current.id}/compact`); openSession(current); };
$("export").onclick = async () => {
  if (!current) return;
  const msgs = await getJSON(`/session/${current.id}/message`);
  let md = `# ${current.title || current.id}\n\n`;
  for (const m of msgs) for (const p of m.parts) if (p.type === "text") md += `## ${m.role === "user" ? "User" : "Assistant"}\n\n${p.text}\n\n`;
  download(`${current.id}.md`, new Blob([md], { type: "text/markdown" }));
};
$("share").onclick = async () => { if (current) download(`${current.id}.html`, await (await api("GET", `/session/${current.id}/share`)).blob()); };
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
$("theme").onchange = () => {
  const t = $("theme").value;
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  store.set("shaman.theme", t);
};
$("model").onchange = () => current && usage(current);
$("token-save").onclick = () => { token = $("token").value; store.set("shaman.token", token); $("auth").classList.remove("open"); init(); };
if (store.get("shaman.theme")) { document.documentElement.dataset.theme = store.get("shaman.theme"); $("theme").value = store.get("shaman.theme"); }

async function init() {
  const [agents, ms, cmds, info] = await Promise.all([getJSON("/agents"), getJSON("/models"), getJSON("/commands"), getJSON("/info").catch(() => ({}))]);
  models = ms; commands = cmds;
  $("agent").innerHTML = agents.filter((a) => a.mode !== "subagent").map((a) => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("");
  $("model").innerHTML = `<option value="" title="${esc(info.default_model || "")}">${esc(info.default_model ? info.default_model.split("/").pop() + " (default)" : "default model")}</option>` +
    ms.map((m) => `<option value="${esc(m.id)}">${esc(m.id)}${m.free ? " (free)" : ""}</option>`).join("");
  if (info.project) document.title = "shaman · " + info.project.split(/[\\/]/).pop();
  if (info.update) setTimeout(() => add("notice", `shaman ${esc(info.update)} is available (you have ${esc(info.version)}): run <code>shaman upgrade</code>`), 800);
  await loadSessions();
  const last = allSessions.find((s) => s.id === store.get("shaman.session")) || allSessions[0];
  if (last) openSession(last);
  $("input").focus();
}
init().catch(() => {});
</script>
</body>
</html>
